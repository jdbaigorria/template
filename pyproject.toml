[project]
name = "template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []


[dependency-groups]
dev = [
  "ruff>=0.11.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pre-commit>=3.7.0",
  "commitizen>=3.0.0",
  "detect-secrets>=1.5.0",
  "yamllint>=1.35.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T201"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
  "pyproject.toml:^version ="
]
